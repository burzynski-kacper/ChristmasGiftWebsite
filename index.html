<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎄 Świąteczne Losowanie Prezentów</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #050B14;
      --bg-mid: #0B192C;
      --bg-bottom: #132A46;
      --gold: #FFD166;
      --gold-glow: rgba(255, 209, 102, 0.6);
      --crimson: #E63946;
      --emerald: #2A9D8F;
      --snow: #F1FAEE;
      --card-bg: rgba(15, 29, 49, 0.78);
      --card-border: rgba(255, 209, 102, 0.28);
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 15%, #173254 0%, var(--bg-mid) 50%, var(--bg-top) 100%);
      color: var(--snow);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      position: relative;
      padding: 48px 16px 90px;
    }

    /* Padający śnieg na pełnym ekranie */
    #snowCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* Górny sznur światełek świątecznych */
    .lightrope {
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      position: fixed;
      top: -12px;
      left: 0;
      width: 100%;
      z-index: 10;
      margin: 0;
      padding: 0;
      pointer-events: none;
    }

    .lightrope li {
      position: relative;
      animation-fill-mode: both;
      animation-iteration-count: infinite;
      list-style: none;
      margin: 0 18px;
      padding: 0;
      display: inline-block;
      width: 12px;
      height: 24px;
      border-radius: 50%;
      background: #ff4d4d;
      box-shadow: 0px 4px 20px 3px #ff4d4d;
      animation-name: flash-1;
      animation-duration: 2.2s;
    }

    .lightrope li:nth-child(2n+1) {
      background: #4dff88;
      box-shadow: 0px 4px 20px 3px rgba(77, 255, 136, 0.8);
      animation-name: flash-2;
      animation-duration: 1.4s;
    }

    .lightrope li:nth-child(4n+2) {
      background: #ffd166;
      box-shadow: 0px 4px 20px 3px rgba(255, 209, 102, 0.9);
      animation-name: flash-3;
      animation-duration: 1.8s;
    }

    .lightrope li:nth-child(3n) {
      background: #4da6ff;
      box-shadow: 0px 4px 20px 3px rgba(77, 166, 255, 0.85);
      animation-duration: 2.6s;
    }

    .lightrope li::before {
      content: "";
      position: absolute;
      background: #222;
      width: 10px;
      height: 8px;
      border-radius: 3px;
      top: -4px;
      left: 1px;
    }

    .lightrope li::after {
      content: "";
      top: -12px;
      left: 6px;
      position: absolute;
      width: 48px;
      height: 16px;
      border-bottom: solid #222 2px;
      border-radius: 50%;
    }

    @keyframes flash-1 {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.92); }
    }

    @keyframes flash-2 {
      0%, 100% { opacity: 0.4; transform: scale(0.92); }
      50% { opacity: 1; transform: scale(1); }
    }

    @keyframes flash-3 {
      0%, 100% { opacity: 0.95; }
      40% { opacity: 0.3; }
      70% { opacity: 1; }
    }

    /* Nagłówek */
    header {
      position: relative;
      z-index: 3;
      text-align: center;
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Mountains of Christmas', cursive;
      font-size: clamp(2.4rem, 5vw, 3.6rem);
      margin: 0;
      color: var(--gold);
      text-shadow: 0 0 18px rgba(255, 209, 102, 0.55), 0 4px 10px rgba(0, 0, 0, 0.6);
      letter-spacing: 1.5px;
    }

    .subtitle {
      margin: 6px 0 0;
      font-size: 1rem;
      color: #BFD7EA;
      max-width: 480px;
      line-height: 1.45;
    }

    /* Główna scena z choinką */
    .stage {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 680px;
    }

    .tree-wrapper {
      position: relative;
      width: 100%;
      max-width: 520px;
      aspect-ratio: 520 / 590;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 4px auto 0;
      filter: drop-shadow(0 16px 36px rgba(0, 0, 0, 0.65));
    }

    .tree-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Gwiazda na czubku choinki */
    .tree-star {
      transform-origin: 260px 55px;
      animation: starPulse 2.8s ease-in-out infinite;
      cursor: pointer;
    }

    @keyframes starPulse {
      0%, 100% {
        transform: scale(1) rotate(0deg);
        filter: drop-shadow(0 0 14px #FFD166) drop-shadow(0 0 28px #FFA600);
      }
      50% {
        transform: scale(1.12) rotate(4deg);
        filter: drop-shadow(0 0 24px #FFF3B0) drop-shadow(0 0 45px #FFD166);
      }
    }

    /* Migoczące światełka na choince */
    .fairy-light {
      animation: twinkle 2s infinite ease-in-out alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.35; r: 3.5px; }
      100% { opacity: 1; r: 5.5px; filter: drop-shadow(0 0 8px currentColor); }
    }

    /* Warstwa na interaktywne bombki z imionami */
    .ornaments-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .bauble-slot {
      position: absolute;
      transform: translate(-50%, -10px);
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transform-origin: top center;
      animation: gentleSwing 4.2s ease-in-out infinite;
      transition: filter 0.25s ease, z-index 0s;
      z-index: 4;
    }

    .bauble-slot:nth-child(odd) {
      animation-duration: 3.7s;
      animation-direction: alternate-reverse;
    }

    .bauble-slot:nth-child(3n) {
      animation-duration: 4.8s;
    }

    .bauble-slot:hover:not(.drawn) {
      z-index: 15;
      animation-play-state: paused;
    }

    @keyframes gentleSwing {
      0%, 100% { transform: translate(-50%, -10px) rotate(-3.5deg); }
      50% { transform: translate(-50%, -10px) rotate(3.5deg); }
    }

    /* Zawieszka i sznurek bombki */
    .bauble-string {
      width: 2px;
      height: 14px;
      background: linear-gradient(to bottom, rgba(255, 209, 102, 0.4), var(--gold));
    }

    .bauble-cap {
      width: 14px;
      height: 6px;
      background: linear-gradient(90deg, #B38728, #FBF5B7, #AA771C);
      border-radius: 2px 2px 0 0;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    /* Kula bombki */
    .bauble-sphere {
      min-width: 72px;
      height: 72px;
      padding: 0 12px;
      border-radius: 999px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      color: #fff;
      font-weight: 700;
      font-size: 0.92rem;
      letter-spacing: 0.3px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.65);
      box-shadow:
        inset -8px -10px 18px rgba(0, 0, 0, 0.45),
        inset 6px 6px 14px rgba(255, 255, 255, 0.35),
        0 8px 18px rgba(0, 0, 0, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.22);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease, border-color 0.25s ease;
    }

    /* Odblask na bombce */
    .bauble-sphere::before {
      content: "";
      position: absolute;
      top: 9px;
      left: 12px;
      width: 18px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.45);
      transform: rotate(-28deg);
      pointer-events: none;
    }

    .bauble-slot:hover:not(.drawn) .bauble-sphere {
      transform: scale(1.16) translateY(-3px);
      border-color: #FFF3B0;
      box-shadow:
        inset -8px -10px 18px rgba(0, 0, 0, 0.45),
        inset 6px 6px 14px rgba(255, 255, 255, 0.5),
        0 0 24px var(--gold-glow),
        0 10px 22px rgba(0, 0, 0, 0.6);
    }

    /* Aktywnie wybrana bombka */
    .bauble-slot.selected {
      z-index: 20;
    }

    .bauble-slot.selected .bauble-sphere {
      transform: scale(1.2);
      border: 2.5px solid #FFF;
      box-shadow:
        0 0 0 4px rgba(255, 209, 102, 0.5),
        0 0 32px rgba(255, 209, 102, 0.95),
        inset 0 0 15px rgba(255, 255, 255, 0.5);
    }

    /* Bombka osoby, która już wylosowała */
    .bauble-slot.drawn {
      cursor: not-allowed;
      opacity: 0.62;
      filter: grayscale(0.45);
    }

    .bauble-slot.drawn .bauble-sphere {
      background: radial-gradient(circle at 30% 30%, #415A77, #1B263B) !important;
      border-color: rgba(255, 255, 255, 0.15);
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.6);
    }

    .bauble-status {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-top: 2px;
      padding: 1px 6px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.38);
      color: #FFE699;
    }

    .bauble-slot.drawn .bauble-status {
      color: #98C1D9;
      background: rgba(0, 0, 0, 0.5);
    }

    /* Panel sterowania / akcji pod choinką */
    .control-card {
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 22px 26px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55), 0 0 25px rgba(255, 209, 102, 0.08);
      margin-top: -12px;
      position: relative;
      z-index: 6;
      transition: transform 0.3s ease;
    }

    .selection-info {
      font-size: 1.05rem;
      color: #E0FBFC;
      margin-bottom: 14px;
      min-height: 1.6em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .selected-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 209, 102, 0.18);
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 3px 12px;
      border-radius: 999px;
      font-weight: 700;
    }

    .draw-btn {
      width: 100%;
      padding: 15px 22px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #E63946 0%, #B51724 100%);
      color: #fff;
      font-family: inherit;
      font-size: 1.08rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(230, 57, 70, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .draw-btn:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 12px 28px rgba(230, 57, 70, 0.65), 0 0 18px rgba(255, 209, 102, 0.35);
    }

    .draw-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .draw-btn:disabled {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.4);
      box-shadow: none;
      cursor: not-allowed;
    }

    /* Wynik losowania - animowany prezent */
    #result {
      margin-top: 16px;
      min-height: 2.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .gift-reveal {
      margin-top: 6px;
      padding: 16px 20px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(42, 157, 143, 0.22), rgba(255, 209, 102, 0.16));
      border: 1.5px solid var(--gold);
      box-shadow: 0 0 28px rgba(255, 209, 102, 0.25);
      animation: popReveal 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      width: 100%;
    }

    .gift-reveal .label {
      font-size: 0.88rem;
      color: #BFD7EA;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .gift-reveal .target-name {
      font-family: 'Mountains of Christmas', cursive;
      font-size: 2.3rem;
      color: var(--gold);
      text-shadow: 0 0 16px rgba(255, 209, 102, 0.6);
      margin: 2px 0;
    }

    @keyframes popReveal {
      0% { opacity: 0; transform: scale(0.75) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .shake-tree {
      animation: treeShake 0.6s ease-in-out;
    }

    @keyframes treeShake {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-2.2deg); }
      40% { transform: rotate(2.2deg); }
      60% { transform: rotate(-1.5deg); }
      80% { transform: rotate(1.5deg); }
    }

    /* Śnieżne zaspy na dole ekranu */
    .snow-hills {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 75px;
      pointer-events: none;
      z-index: 1;
    }

    @media (max-width: 480px) {
      .bauble-sphere {
        min-width: 62px;
        height: 62px;
        font-size: 0.82rem;
      }
      .control-card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>
  <!-- Sznur lampek u góry -->
  <ul class="lightrope" aria-hidden="true">
    <li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li>
    <li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li>
    <li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li>
  </ul>

  <!-- Canvas z opadającym śniegiem i płatkami -->
  <canvas id="snowCanvas"></canvas>

  <header>
    <h1>🎄 Świąteczne Losowanie 🎅</h1>
    <p class="subtitle">Znajdź swoją bombkę na choince, kliknij swoje imię i sprawdź, komu podarujesz prezent!</p>
  </header>

  <main class="stage">
    <div class="tree-wrapper" id="treeWrapper">
      <!-- Duża ilustrowana choinka SVG z prezentami i światełkami -->
      <svg class="tree-svg" viewBox="0 0 520 590" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFF8D6" stop-opacity="0.9" />
            <stop offset="45%" stop-color="#FFD166" stop-opacity="0.4" />
            <stop offset="100%" stop-color="#FFD166" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="pineTop" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2D6A4F" />
            <stop offset="100%" stop-color="#1B4332" />
          </linearGradient>
          <linearGradient id="pineMid" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#245C43" />
            <stop offset="100%" stop-color="#143628" />
          </linearGradient>
          <linearGradient id="pineBot" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1E4E38" />
            <stop offset="100%" stop-color="#0F291E" />
          </linearGradient>
          <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#3D2314" />
            <stop offset="50%" stop-color="#5C3824" />
            <stop offset="100%" stop-color="#2F1A0E" />
          </linearGradient>
          <linearGradient id="goldGarland" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FFD166" />
            <stop offset="50%" stop-color="#FFF3B0" />
            <stop offset="100%" stop-color="#F4A261" />
          </linearGradient>
        </defs>

        <!-- Cień pod choinką -->
        <ellipse cx="260" cy="548" rx="180" ry="22" fill="rgba(0, 0, 0, 0.45)" />

        <!-- Pień choinki -->
        <rect x="232" y="465" width="56" height="78" rx="8" fill="url(#trunkGrad)" />

        <!-- Dolne piętro gałęzi -->
        <path d="M 260 250 L 55 490 Q 155 518 260 492 Q 365 518 465 490 Z" fill="url(#pineBot)" />
        <!-- Śnieg na dolnych gałęziach -->
        <path d="M 55 490 Q 105 505 155 488 Q 210 508 260 492 Q 315 508 365 488 Q 415 505 465 490" fill="none" stroke="#E0FBFC" stroke-width="6" stroke-linecap="round" opacity="0.7" />

        <!-- Środkowe piętro gałęzi -->
        <path d="M 260 155 L 92 375 Q 175 402 260 378 Q 345 402 428 375 Z" fill="url(#pineMid)" />
        <path d="M 92 375 Q 140 390 190 376 Q 260 395 330 376 Q 380 390 428 375" fill="none" stroke="#E0FBFC" stroke-width="5.5" stroke-linecap="round" opacity="0.75" />

        <!-- Górne piętro gałęzi -->
        <path d="M 260 68 L 135 255 Q 198 278 260 258 Q 322 278 385 255 Z" fill="url(#pineTop)" />
        <path d="M 135 255 Q 198 272 260 258 Q 322 272 385 255" fill="none" stroke="#E0FBFC" stroke-width="5" stroke-linecap="round" opacity="0.8" />

        <!-- Złote łańcuchy (girlandy) -->
        <path d="M 172 195 Q 260 238 352 185" fill="none" stroke="url(#goldGarland)" stroke-width="3.5" stroke-dasharray="3 7" stroke-linecap="round" opacity="0.85" />
        <path d="M 130 315 Q 260 368 392 300" fill="none" stroke="url(#goldGarland)" stroke-width="4" stroke-dasharray="3 8" stroke-linecap="round" opacity="0.85" />
        <path d="M 92 435 Q 260 495 430 420" fill="none" stroke="url(#goldGarland)" stroke-width="4.5" stroke-dasharray="4 9" stroke-linecap="round" opacity="0.85" />

        <!-- Światełka choinkowe (fairy lights) -->
        <g>
          <circle class="fairy-light" cx="235" cy="145" r="4.5" fill="#FFD166" style="animation-delay: 0.1s" />
          <circle class="fairy-light" cx="288" cy="162" r="4.5" fill="#FF4D6D" style="animation-delay: 0.6s" />
          <circle class="fairy-light" cx="205" cy="215" r="4.5" fill="#4CC9F0" style="animation-delay: 1.1s" />
          <circle class="fairy-light" cx="315" cy="225" r="4.5" fill="#80ED99" style="animation-delay: 0.3s" />
          <circle class="fairy-light" cx="260" cy="285" r="4.5" fill="#FFD166" style="animation-delay: 0.9s" />
          <circle class="fairy-light" cx="170" cy="335" r="4.5" fill="#FF4D6D" style="animation-delay: 1.4s" />
          <circle class="fairy-light" cx="350" cy="330" r="4.5" fill="#4CC9F0" style="animation-delay: 0.2s" />
          <circle class="fairy-light" cx="220" cy="405" r="4.5" fill="#80ED99" style="animation-delay: 0.7s" />
          <circle class="fairy-light" cx="305" cy="415" r="4.5" fill="#FFD166" style="animation-delay: 1.3s" />
          <circle class="fairy-light" cx="135" cy="458" r="4.5" fill="#4CC9F0" style="animation-delay: 0.5s" />
          <circle class="fairy-light" cx="385" cy="455" r="4.5" fill="#FF4D6D" style="animation-delay: 1.0s" />
        </g>

        <!-- Prezenty pod choinką -->
        <!-- Prezent 1 (czerwony po lewej) -->
        <g transform="translate(135, 492)">
          <rect x="0" y="10" width="54" height="44" rx="5" fill="#E63946" />
          <rect x="-3" y="4" width="60" height="12" rx="4" fill="#F25C66" />
          <rect x="22" y="4" width="10" height="50" fill="#FFD166" />
          <rect x="0" y="26" width="54" height="9" fill="#FFD166" />
          <path d="M 27 4 C 15 -8, 8 4, 27 6 C 46 4, 39 -8, 27 4 Z" fill="#FFD166" />
        </g>

        <!-- Prezent 2 (turkusowy po prawej) -->
        <g transform="translate(325, 486)">
          <rect x="0" y="12" width="62" height="50" rx="5" fill="#2A9D8F" />
          <rect x="-3" y="5" width="68" height="13" rx="4" fill="#38B2A3" />
          <rect x="26" y="5" width="10" height="57" fill="#FFF3B0" />
          <rect x="0" y="32" width="62" height="9" fill="#FFF3B0" />
          <path d="M 31 5 C 17 -9, 10 5, 31 7 C 52 5, 45 -9, 31 5 Z" fill="#FFF3B0" />
        </g>

        <!-- Prezent 3 (fioletowo-złoty na środku) -->
        <g transform="translate(212, 510)">
          <rect x="0" y="8" width="46" height="36" rx="4" fill="#7209B7" />
          <rect x="19" y="8" width="8" height="36" fill="#FFD166" />
          <rect x="0" y="22" width="46" height="7" fill="#FFD166" />
        </g>

        <!-- Poświata i Gwiazda Betlejemska na czubku -->
        <circle cx="260" cy="55" r="52" fill="url(#starGlow)" />
        <g class="tree-star" id="treeStar" title="Wesołych Świąt!">
          <polygon points="260,12 273,40 303,44 281,65 286,95 260,80 234,95 239,65 217,44 247,40" fill="#FFD166" stroke="#FFF8D6" stroke-width="2" />
          <polygon points="260,24 268,43 288,46 273,60 277,80 260,70 243,80 247,60 232,46 252,43" fill="#FFF3B0" />
        </g>
      </svg>

      <!-- Tutaj dynamicznie zawiesimy bombki z imionami uczestników -->
      <div class="ornaments-layer" id="ornamentsLayer"></div>
    </div>

    <!-- Karta wyboru i losowania -->
    <div class="control-card">
      <div class="selection-info" id="selectionInfo">
        ✨ Kliknij swoją bombkę na choince powyżej, aby zacząć!
      </div>

      <button id="drawBtn" class="draw-btn" disabled>
        <span>🎁</span>
        <span id="drawBtnText">Najpierw wybierz swoją bombkę</span>
      </button>

      <div id="result"></div>
    </div>
  </main>

  <!-- Śnieżne zaspy na samym dole -->
  <svg class="snow-hills" viewBox="0 0 1440 120" preserveAspectRatio="none">
    <path d="M0,40 Q360,110 720,55 T1440,50 L1440,120 L0,120 Z" fill="rgba(224, 251, 252, 0.15)" />
    <path d="M0,75 Q420,20 880,75 T1440,65 L1440,120 L0,120 Z" fill="rgba(241, 250, 238, 0.28)" />
  </svg>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 1. Adres bazy z Firebase Realtime Database
    const firebaseConfig = {
      databaseURL: "https://santapage-ab031-default-rtdb.europe-west1.firebasedatabase.app"
    };

    // 2. Lista uczestników wpisana na sztywno
    const PARTICIPANTS = ["Kacper", "Kasia", "Tomek", "Monika", "Paweł", "Kamila"];

    // Pozycje i kolory bombek na choince (dopasowane do kształtu drzewka)
    const ORNAMENT_SPOTS = [
      { left: "40%", top: "30%", gradient: "radial-gradient(circle at 30% 30%, #FF5A5F, #9E0004)" },
      { left: "61%", top: "32%", gradient: "radial-gradient(circle at 30% 30%, #FFD166, #B36B00)" },
      { left: "31%", top: "50%", gradient: "radial-gradient(circle at 30% 30%, #48CAE4, #023E8A)" },
      { left: "51%", top: "53%", gradient: "radial-gradient(circle at 30% 30%, #B5179E, #480CA8)" },
      { left: "69%", top: "50%", gradient: "radial-gradient(circle at 30% 30%, #52B788, #1B4332)" },
      { left: "41%", top: "71%", gradient: "radial-gradient(circle at 30% 30%, #F77F00, #9B2226)" },
      { left: "61%", top: "72%", gradient: "radial-gradient(circle at 30% 30%, #FF4D6D, #800F2F)" }
    ];

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const stateRef = ref(db, 'santa_state');

    const ornamentsLayer = document.getElementById('ornamentsLayer');
    const selectionInfo = document.getElementById('selectionInfo');
    const btnEl = document.getElementById('drawBtn');
    const btnTextEl = document.getElementById('drawBtnText');
    const resultEl = document.getElementById('result');
    const treeWrapper = document.getElementById('treeWrapper');

    let selectedUser = "";
    let currentData = {};

    // Funkcja generująca bezpieczny cykl (nikt nie wylosuje siebie i nikt nie zostanie zablokowany na końcu)
    function generatePairs(names) {
      const shuffled = [...names].sort(() => Math.random() - 0.5);
      const pairs = {};
      for (let i = 0; i < shuffled.length; i++) {
        const giver = shuffled[i];
        const receiver = shuffled[(i + 1) % shuffled.length];
        pairs[giver] = { target: receiver, drawn: false };
      }
      return pairs;
    }

    // Renderowanie bombek na choince
    function renderOrnaments(data) {
      ornamentsLayer.innerHTML = '';

      PARTICIPANTS.forEach((name, idx) => {
        const personState = data[name] || { drawn: false };
        const isDrawn = Boolean(personState.drawn);
        const spot = ORNAMENT_SPOTS[idx % ORNAMENT_SPOTS.length];

        const slot = document.createElement('div');
        slot.className = `bauble-slot ${isDrawn ? 'drawn' : ''} ${selectedUser === name ? 'selected' : ''}`;
        slot.style.left = spot.left;
        slot.style.top = spot.top;
        slot.dataset.name = name;

        slot.innerHTML = `
          <div class="bauble-string"></div>
          <div class="bauble-cap"></div>
          <div class="bauble-sphere" style="background: ${spot.gradient}">
            <span>${name}</span>
            <span class="bauble-status">${isDrawn ? '✓ Wylosowano' : 'Kliknij'}</span>
          </div>
        `;

        slot.addEventListener('click', () => {
          if (isDrawn) {
            selectionInfo.innerHTML = `🎅 <strong>${name}</strong> już wylosował(a) swoją osobę! Wybierz inną bombkę.`;
            return;
          }
          selectParticipant(name);
        });

        ornamentsLayer.appendChild(slot);
      });
    }

    function selectParticipant(name) {
      selectedUser = name;
      resultEl.innerHTML = '';

      document.querySelectorAll('.bauble-slot').forEach(el => {
        el.classList.toggle('selected', el.dataset.name === name);
      });

      selectionInfo.innerHTML = `Wybrana bombka: <span class="selected-badge">🎄 ${name}</span>`;
      btnEl.disabled = false;
      btnTextEl.textContent = `Losuj osobę jako ${name}!`;
    }

    async function init() {
      selectionInfo.textContent = "⏳ Zawieszanie bombek na choince...";
      try {
        const snapshot = await get(stateRef);
        let data = snapshot.val();

        // Jeśli baza jest pusta, pierwszy użytkownik automatycznie inicjalizuje koszyk
        if (!data) {
          data = generatePairs(PARTICIPANTS);
          await set(stateRef, data);
        }

        currentData = data;
        renderOrnaments(currentData);

        const remaining = PARTICIPANTS.filter(n => currentData[n] && !currentData[n].drawn);
        if (remaining.length === 0) {
          selectionInfo.innerHTML = "🎉 Wszyscy uczestnicy wylosowali już swoje prezenty! Wesołych Świąt!";
          btnTextEl.textContent = "Losowanie zakończone";
          btnEl.disabled = true;
        } else {
          selectionInfo.innerHTML = "✨ Kliknij swoją bombkę z imieniem na choince!";
        }
      } catch (err) {
        console.error(err);
        selectionInfo.textContent = "⚠️ Błąd połączenia z bazą losowania. Odśwież stronę.";
      }
    }

    btnEl.addEventListener('click', async () => {
      if (!selectedUser) return;

      const user = selectedUser;
      btnEl.disabled = true;
      btnTextEl.textContent = "🥁 Trwa świąteczne losowanie...";

      // Efekt potrząśnięcia choinką
      treeWrapper.classList.remove('shake-tree');
      void treeWrapper.offsetWidth;
      treeWrapper.classList.add('shake-tree');

      const snapshot = await get(stateRef);
      const data = snapshot.val();
      currentData = data;

      if (data[user].drawn) {
        resultEl.innerHTML = `<div style="color:#FF6B6B; font-weight:700; margin-top:8px;">Ta osoba już wcześniej losowała!</div>`;
        selectedUser = "";
        renderOrnaments(currentData);
        btnTextEl.textContent = "Wybierz inną bombkę";
        return;
      }

      // Oznaczamy w bazie, że osoba już wylosowała
      await update(ref(db, `santa_state/${user}`), { drawn: true });
      currentData[user].drawn = true;

      // Wystrzał świątecznych iskier śnieżnych
      spawnCelebrationBurst();

      resultEl.innerHTML = `
        <div class="gift-reveal">
          <div class="label">🎅 ${user}, w te Święta robisz prezent dla:</div>
          <div class="target-name">🎁 ${data[user].target} 🎁</div>
        </div>
      `;

      selectedUser = "";
      renderOrnaments(currentData);
      selectionInfo.innerHTML = "✨ Gotowe! Zapisz wynik i nikomu nie zdradzaj tajemnicy 🤫";
      btnTextEl.textContent = "Wylosowano pomyślnie!";
    });

    // Kliknięcie w gwiazdę na czubku choinki daje dodatkowy rozbłysk śniegu
    document.getElementById('treeStar').addEventListener('click', () => {
      spawnCelebrationBurst();
    });

    // --- Animacja padającego śniegu i złotych drobinek na Canvasie ---
    const canvas = document.getElementById('snowCanvas');
    const ctx = canvas.getContext('2d');
    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const snowflakes = Array.from({ length: 130 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 3.4 + 1,
      speedY: Math.random() * 1.3 + 0.45,
      speedX: (Math.random() - 0.5) * 0.6,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: Math.random() * 0.02 + 0.008,
      opacity: Math.random() * 0.65 + 0.3
    }));

    const sparkles = [];

    function spawnCelebrationBurst() {
      const cx = width / 2;
      const cy = height * 0.45;
      const colors = ['#FFD166', '#FFF3B0', '#FF4D6D', '#80ED99', '#4CC9F0', '#FFFFFF'];
      for (let i = 0; i < 65; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        sparkles.push({
          x: cx,
          y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2,
          r: Math.random() * 4 + 2,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1
        });
      }
    }

    function animateSnow() {
      ctx.clearRect(0, 0, width, height);

      // Płatki śniegu
      for (const f of snowflakes) {
        f.sway += f.swaySpeed;
        f.y += f.speedY;
        f.x += f.speedX + Math.sin(f.sway) * 0.45;

        if (f.y > height + 10) {
          f.y = -10;
          f.x = Math.random() * width;
        }
        if (f.x > width + 10) f.x = -10;
        if (f.x < -10) f.x = width + 10;

        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(241, 250, 238, ${f.opacity})`;
        ctx.fill();
      }

      // Świąteczne iskry przy losowaniu
      for (let i = sparkles.length - 1; i >= 0; i--) {
        const p = sparkles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.12;
        p.alpha -= 0.016;

        if (p.alpha <= 0) {
          sparkles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.restore();
      }

      requestAnimationFrame(animateSnow);
    }

    animateSnow();
    init();
  </script>
</body>

</html>
